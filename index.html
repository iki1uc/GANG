:root{
  --bg:#0a0a10;
  --surface:#10141f;
  --surface2:#151a28;
  --line:rgba(100,200,255,.12);
  --text:#d0d9e6;
  --muted:#6a8aa0;
  --dim:#3d5a70;
  --gold:#ffcc44;
  --cyan:#7fc9ff;
  --magenta:#ff66ff;
  --green:#00ff88;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#07070c;
    --surface:#0d111c;
    --surface2:#131824;
    --text:#dbe6f2;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Consolas,'Courier New',monospace
}

button{
  font-family:inherit
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 18px 24px;
  background:radial-gradient(ellipse at 50% 0%, #0f1a22, #000 72%);
  max-width:1440px;
  margin:0 auto
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  padding:22px 6px 18px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  font-size:10px;
  letter-spacing:4px;
  color:var(--dim)
}

h1{
  font-size:clamp(24px,4vw,44px);
  font-weight:300;
  letter-spacing:5px;
  margin:8px 0 6px;
  background:linear-gradient(90deg,var(--cyan),var(--gold),var(--magenta));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

h1 span{
  color:var(--gold);
  -webkit-text-fill-color:var(--gold)
}

.tagline{
  font-size:15px;
  color:#e8f2ff;
  margin:0
}

.claim{
  color:var(--gold);
  font-size:13px;
  margin:5px 0 0
}

.top-badge{
  background:rgba(10,14,20,.65);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 18px;
  text-align:center;
  min-width:150px;
  backdrop-filter:blur(8px)
}

.top-badge strong{
  display:block;
  font-size:30px;
  color:var(--gold);
  line-height:1
}

.top-badge span{
  display:block;
  font-size:9px;
  letter-spacing:3px;
  color:var(--muted);
  margin:4px 0
}

.top-badge em{
  font-style:normal;
  font-size:10px;
  color:var(--cyan)
}

.statusbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px 22px;
  padding:11px 8px;
  color:var(--muted);
  font-size:11px;
  border-bottom:1px solid rgba(100,200,255,.07)
}

.statusbar span:first-child{
  color:var(--green)
}

.corridor{
  display:grid;
  grid-template-columns:300px minmax(0,1fr) 300px;
  gap:16px;
  margin-top:16px;
  align-items:start
}

.panel{
  background:rgba(10,14,20,.62);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  backdrop-filter:blur(8px);
  min-width:0
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:10px
}

.kicker{
  font-size:9px;
  letter-spacing:3px;
  color:var(--dim)
}

.panel h2{
  font-size:18px;
  letter-spacing:2px;
  margin:4px 0 0;
  font-weight:400
}

.count,.bridge-status{
  font-size:10px;
  color:var(--cyan);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  white-space:nowrap
}

.hint{
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  margin:12px 0
}

.subline{
  text-align:center;
  color:var(--dim);
  font-size:10px;
  letter-spacing:3px;
  margin:10px 0
}

.gang-list{
  display:flex;
  flex-direction:column;
  gap:5px;
  max-height:470px;
  overflow-y:auto;
  padding-right:3px
}

.gang{
  display:grid;
  grid-template-columns:28px 1fr auto 16px;
  gap:8px;
  align-items:center;
  text-align:left;
  width:100%;
  background:rgba(0,0,0,.2);
  border:1px solid transparent;
  border-left:2px solid var(--dim);
  color:var(--text);
  border-radius:9px;
  padding:8px 9px;
  cursor:pointer
}

.gang:hover{
  background:rgba(30,50,70,.25)
}

.gang.active{
  border-color:rgba(127,201,255,.35);
  background:rgba(20,45,65,.35);
  border-left-color:var(--cyan)
}

.gang.visited{
  border-left-color:var(--gold)
}

.gang-num{
  color:var(--dim);
  font-size:10px
}

.gang-main{
  display:flex;
  flex-direction:column;
  min-width:0
}

.gang-main strong{
  font-size:13px
}

.gang-main small{
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.gang-meta{
  font-size:9px;
  color:var(--muted);
  text-align:right;
  line-height:1.4
}

.arrow{
  color:var(--dim)
}

.gang-detail{
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:13px
}

.detail-top{
  display:flex;
  justify-content:space-between;
  align-items:start
}

.detail-top h3{
  margin:3px 0 2px;
  color:var(--gold);
  font-size:20px
}

.detail-top p{
  margin:0;
  color:var(--muted);
  font-size:11px
}

.file-count{
  font-size:10px;
  color:var(--cyan)
}

.gang-detail ul{
  list-style:none;
  padding:0;
  margin:11px 0 0;
  display:flex;
  flex-wrap:wrap;
  gap:5px
}

.gang-detail li{
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(0,0,0,.25);
  border-radius:6px;
  padding:5px 8px;
  font-size:10px;
  max-width:100%;
  word-break:break-all
}

.file-dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--magenta);
  flex:none
}

.bridge{
  display:grid;
  grid-template-columns:1fr 110px 1fr;
  gap:14px;
  align-items:stretch;
  margin:12px 0
}

.port{
  background:rgba(16,24,32,.45);
  border-radius:16px;
  padding:14px;
  border:1px solid rgba(60,120,180,.08)
}

.port h3{
  font-size:11px;
  letter-spacing:3px;
  color:var(--dim);
  margin:0 0 10px
}

.port .item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  width:100%;
  background:rgba(0,0,0,.2);
  border:1px solid transparent;
  border-left:2px solid var(--cyan);
  color:var(--text);
  border-radius:8px;
  padding:8px 10px;
  margin:5px 0;
  cursor:pointer;
  font-size:12px;
  text-align:left
}

.port.out .item{
  border-left-color:var(--magenta);
  cursor:default
}

.port small{
  color:var(--dim);
  font-size:9px
}

.port b{
  color:var(--gold)
}

.bridge-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-align:center
}

.symbol{
  font-size:38px;
  color:var(--gold);
  text-shadow:0 0 30px rgba(255,204,68,.25)
}

.bridge-center .info{
  font-size:9px;
  letter-spacing:1px;
  color:var(--dim)
}

.bridge-center .bridge-status{
  font-size:9px;
  white-space:normal
}

.matrix{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px
}

.matrix .link{
  background:rgba(0,0,0,.2);
  border:1px solid transparent;
  border-radius:7px;
  color:var(--dim);
  padding:9px 5px;
  font-size:10px;
  cursor:pointer
}

.matrix .link:hover{
  background:rgba(30,50,70,.25)
}

.matrix .link.active{
  color:var(--green);
  border-color:rgba(0,255,136,.25);
  background:rgba(0,255,136,.06)
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  justify-content:center;
  margin:14px 0 8px
}

.controls button{
  background:rgba(20,35,45,.35);
  color:#8ab8e6;
  border:1px solid var(--line);
  padding:9px 14px;
  border-radius:999px;
  font-size:10px;
  cursor:pointer
}

.controls button:hover{
  background:rgba(40,80,100,.25);
  color:#b8e2ff
}

.controls button.primary{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
  font-weight:700
}

.controls button:disabled{
  opacity:.6;
  cursor:wait
}

.keys{
  text-align:center;
  color:var(--dim);
  font-size:9px;
  margin:0
}

.keys b{
  color:var(--muted)
}

.respo-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px
}

.respo{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:rgba(0,0,0,.2);
  border:1px solid transparent;
  border-left:3px solid var(--respo);
  color:var(--text);
  border-radius:9px;
  padding:10px;
  cursor:pointer
}

.respo:hover{
  background:rgba(30,50,70,.25)
}

.respo.active{
  border-color:color-mix(in srgb, var(--respo) 45%, transparent);
  background:rgba(255,255,255,.04)
}

.respo-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--respo);
  box-shadow:0 0 12px var(--respo);
  flex:none
}

.respo span:nth-child(2){
  display:flex;
  flex-direction:column;
  flex:1
}

.respo strong{
  font-size:12px
}

.respo small{
  color:var(--muted);
  font-size:10px
}

.respo-state{
  font-size:9px;
  color:var(--muted)
}

.modules{
  margin-top:16px
}

.modules h3{
  font-size:10px;
  letter-spacing:3px;
  color:var(--dim);
  margin:0 0 8px
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.chips span{
  background:rgba(0,0,0,.25);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:9px;
  color:#b8c7d8
}

.respo-readout{
  margin-top:14px;
  background:rgba(0,0,0,.25);
  border-radius:12px;
  padding:13px
}

.respo-readout span{
  font-size:9px;
  letter-spacing:3px;
  color:var(--dim)
}

.respo-readout strong{
  display:block;
  font-size:20px;
  margin:4px 0
}

.respo-readout p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.5
}

.meter-wrap{
  margin-top:16px;
  background:rgba(10,14,20,.62);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  backdrop-filter:blur(8px)
}

.meter-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.meter-head h2{
  font-size:19px;
  margin:4px 0 0;
  font-weight:400
}

.meter-value{
  font-size:34px;
  color:var(--gold);
  font-weight:700
}

.meter-track{
  height:18px;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
  background:#05070a;
  margin:14px 0 8px
}

.meter-fill{
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--gold),var(--magenta));
  transition:width .35s ease
}

.meter-labels{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:10px;
  text-align:center
}

.trophy{
  text-align:center;
  color:var(--gold);
  border:1px solid rgba(255,204,68,.35);
  border-radius:12px;
  padding:11px;
  margin-top:12px;
  font-size:12px
}

.log-wrap{
  margin-top:16px;
  background:rgba(10,14,20,.62);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px
}

.log-head{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap
}

.log-head h2{
  font-size:16px;
  letter-spacing:2px;
  margin:0;
  font-weight:400
}

.log-head span{
  color:var(--muted);
  font-size:11px
}

.log-head button{
  margin-left:auto;
  background:transparent;
  color:var(--cyan);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  cursor:pointer;
  font-size:10px
}

.log{
  background:rgba(0,0,0,.3);
  border-radius:12px;
  padding:12px;
  font-size:11px;
  color:var(--muted);
  max-height:160px;
  overflow-y:auto;
  line-height:1.8;
  margin-top:12px
}

.log-empty{
  color:var(--dim)
}

footer{
  text-align:center;
  font-size:10px;
  letter-spacing:2px;
  color:#1f2a36;
  margin-top:18px;
  padding-bottom:8px
}

footer span{
  color:var(--gold)
}

@media(max-width:1050px){
  .corridor{
    grid-template-columns:1fr 1fr
  }

  .bridge-panel{
    grid-column:1/-1;
    order:-1
  }

  .gang-list{
    max-height:360px
  }
}

@media(max-width:650px){
  .shell{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    align-items:start;
    flex-direction:column
  }

  .top-badge{
    min-width:0;
    align-self:flex-start
  }

  .corridor{
    grid-template-columns:1fr
  }

  .bridge-panel{
    order:0
  }

  .bridge{
    grid-template-columns:1fr
  }

  .bridge-center{
    flex-direction:row;
    justify-content:center;
    padding:4px 0
  }

  .matrix{
    grid-template-columns:1fr 1fr
  }

  .meter-labels{
    flex-direction:column;
    gap:4px
  }

  .meter-labels span:nth-child(2){
    order:-1
  }

  .log-head button{
    margin-left:0
  }
}
