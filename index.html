<h1>GANG.SYSTEM.full — iki1uc</h1>
<p>ROOT · Ordner · agent.js · Räume · Moves · RAW · eco · AIR · Diagnose</p>

<div id="root-box" class="box"></div>
<div id="chain-box" class="box"></div>
<div id="rooms-box" class="box"></div>
<div id="moves-box" class="box"></div>
<div id="raw-box" class="box"></div>
<div id="orbit-box" class="box"></div>
<div id="pulse-box" class="box"></div>
<div id="axiom-box" class="box"></div>
<div id="eco-box" class="box"></div>
<div id="air-box" class="box"></div>
<div id="errors-box" class="box"></div>

<script type="module">
  import { GANG_SYSTEM_FULL } from "./GANG/GANG.SYSTEM.full.js";

  async function load() {
    const sys = await GANG_SYSTEM_FULL();

    // ROOT
    document.getElementById("root-box").innerHTML =
      `<h2>ROOT</h2><div class="ok">${sys.root}</div>`;

    // ORDNER-KETTE
    let chainHTML = "<h2>Ordner-Kette</h2>";
    sys.chain.forEach(item => {
      const symbol = item.status === "OK" ? "⭕" : "❌";
      const cls = item.status === "OK" ? "ok" : "err";
      chainHTML += `<div class="${cls}">${symbol} ${item.folder} → ${item.agent || "NO_AGENT"}</div>`;
    });
    document.getElementById("chain-box").innerHTML = chainHTML;

    // ROOMS
    let roomsHTML = "<h2>Rooms</h2>";
    sys.rooms.forEach(r => roomsHTML += `<div class="ok">🏛️ ${r}</div>`);
    document.getElementById("rooms-box").innerHTML = roomsHTML;

    // MOVES
    let movesHTML = "<h2>Moves</h2>";
    sys.moves.forEach(m => movesHTML += `<div class="ok">➡️ ${m}</div>`);
    document.getElementById("moves-box").innerHTML = movesHTML;

    // RAW
    let rawHTML = "<h2>RAW</h2>";
    sys.raw.forEach(r => rawHTML += `<div class="ok">⚡ ${r}</div>`);
    document.getElementById("raw-box").innerHTML = rawHTML;

    // ORBIT
    let orbitHTML = "<h2>Orbit</h2>";
    sys.orbit.forEach(o => orbitHTML += `<div class="ok">🌀 ${o}</div>`);
    document.getElementById("orbit-box").innerHTML = orbitHTML;

    // PULSE
    let pulseHTML = "<h2>Pulse</h2>";
